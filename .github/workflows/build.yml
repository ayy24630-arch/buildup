name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/buildup/app app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BuildUp"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.buildup.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.buildup.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>
              <application android:label="Build Up" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".BlockerService" android:exported="true"
                      android:label="Build Up"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="a11y_desc">Build Up focus timer ke dauraan chune hue apps aur distracting reels block karta hai.</string>
          </resources>
          EOF
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="300"
              android:description="@string/a11y_desc" />
          EOF
          cat > app/src/main/java/com/buildup/app/Prefs.kt <<'EOF'
          package com.buildup.app

          import android.content.Context

          object Prefs {
              const val WORDS = "study,exam,physics,chemistry,maths,math,biology,neet,jee,lecture,class,tutorial,notes,revision,upsc,chapter"
              private fun p(c: Context) = c.getSharedPreferences("bu", Context.MODE_PRIVATE)
              fun endTime(c: Context) = p(c).getLong("end", 0L)
              fun setEnd(c: Context, t: Long) = p(c).edit().putLong("end", t).apply()
              fun active(c: Context) = System.currentTimeMillis() < endTime(c)
              fun apps(c: Context): Set<String> = HashSet(p(c).getStringSet("apps", emptySet()) ?: emptySet())
              fun reel(c: Context) = p(c).getBoolean("reel", true)
              fun words(c: Context) = p(c).getString("words", WORDS) ?: WORDS
              fun minutes(c: Context) = p(c).getInt("min", 30)
              fun save(c: Context, min: Int, reel: Boolean, words: String, apps: Set<String>) =
                  p(c).edit().putInt("min", min).putBoolean("reel", reel)
                      .putString("words", words).putStringSet("apps", HashSet(apps)).apply()
          }
          EOF
          cat > app/src/main/java/com/buildup/app/Notifier.kt <<'EOF'
          package com.buildup.app

          import android.app.*
          import android.content.Context
          import android.content.Intent

          object Notifier {
              fun show(c: Context) {
                  val nm = c.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("focus", "Focus timer", NotificationManager.IMPORTANCE_LOW))
                  val end = Prefs.endTime(c)
                  val open = PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(c, "focus")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("Build Up: Focus mode ON")
                      .setContentText("Time left")
                      .setUsesChronometer(true)
                      .setChronometerCountDown(true)
                      .setWhen(end)
                      .setOngoing(true)
                      .setTimeoutAfter(end - System.currentTimeMillis())
                      .setContentIntent(open)
                      .build()
                  nm.notify(1, n)
              }
              fun hide(c: Context) = c.getSystemService(NotificationManager::class.java).cancel(1)
          }
          EOF
          cat > app/src/main/java/com/buildup/app/BlockerService.kt <<'EOF'
          package com.buildup.app

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast

          class BlockerService : AccessibilityService() {
              private var lastToast = 0L
              private val reelApps = setOf("com.instagram.android", "com.google.android.youtube")
              private val reelIds = listOf(
                  "com.instagram.android:id/clips_viewer_view_pager",
                  "com.instagram.android:id/clips_video_container",
                  "com.google.android.youtube:id/reel_recycler",
                  "com.google.android.youtube:id/reel_player_page_container"
              )

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  val pkg = e?.packageName?.toString() ?: return
                  if (pkg == packageName || !Prefs.active(this)) return
                  if (pkg in Prefs.apps(this)) { kick("Focus mode ON", false); return }
                  if (Prefs.reel(this) && pkg in reelApps) checkReel()
              }

              private fun checkReel() {
                  val root = rootInActiveWindow ?: return
                  if (reelIds.none { root.findAccessibilityNodeInfosByViewId(it).isNotEmpty() }) return
                  val sb = StringBuilder()
                  collect(root, sb, 0)
                  val text = sb.toString().lowercase()
                  val ok = Prefs.words(this).split(",").map { it.trim().lowercase() }
                      .filter { it.isNotEmpty() }.any { text.contains(it) }
                  if (!ok) kick("Distracting reel blocked", true)
              }

              private fun collect(n: AccessibilityNodeInfo?, sb: StringBuilder, d: Int) {
                  if (n == null || d > 25 || sb.length > 4000) return
                  n.text?.let { sb.append(it).append(' ') }
                  n.contentDescription?.let { sb.append(it).append(' ') }
                  for (i in 0 until n.childCount) collect(n.getChild(i), sb, d + 1)
              }

              private fun kick(msg: String, back: Boolean) {
                  performGlobalAction(if (back) GLOBAL_ACTION_BACK else GLOBAL_ACTION_HOME)
                  val now = System.currentTimeMillis()
                  if (now - lastToast > 3000) {
                      lastToast = now
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onInterrupt() {}
          }
          EOF
          cat > app/src/main/java/com/buildup/app/MainActivity.kt <<'EOF'
          package com.buildup.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var minutes: EditText
              private lateinit var words: EditText
              private lateinit var reels: Switch
              private lateinit var status: TextView
              private val checks = LinkedHashMap<String, CheckBox>()

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(40, 60, 40, 60)
                  fun label(t: String, s: Float = 16f) = TextView(this).also { it.text = t; it.textSize = s; col.addView(it) }
                  label("Build Up", 30f)
                  status = label("")
                  Button(this).also {
                      it.text = "1) Accessibility ON karo"
                      it.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                      col.addView(it)
                  }
                  label("2) Timer (minutes):")
                  minutes = EditText(this).also {
                      it.inputType = InputType.TYPE_CLASS_NUMBER
                      it.setText(Prefs.minutes(this).toString())
                      col.addView(it)
                  }
                  reels = Switch(this).also {
                      it.text = "Distracting reels/shorts block (study wale allowed)"
                      it.isChecked = Prefs.reel(this)
                      col.addView(it)
                  }
                  label("Allowed study words (comma se alag karo):")
                  words = EditText(this).also { it.setText(Prefs.words(this)); col.addView(it) }
                  Button(this).also { it.text = "START FOCUS"; it.setOnClickListener { start() }; col.addView(it) }
                  Button(this).also { it.text = "STOP"; it.setOnClickListener { stop() }; col.addView(it) }
                  label("Ye apps timer mein poori tarah block honge:")
                  val launcher = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = packageManager.queryIntentActivities(launcher, 0)
                      .map { it.activityInfo.packageName to it.loadLabel(packageManager).toString() }
                      .filter { it.first != packageName }
                      .distinctBy { it.first }
                      .sortedBy { it.second.lowercase() }
                  val saved = Prefs.apps(this)
                  for ((pkg, name) in list) {
                      val cb = CheckBox(this)
                      cb.text = name
                      cb.isChecked = pkg in saved
                      checks[pkg] = cb
                      col.addView(cb)
                  }
                  setContentView(ScrollView(this).also { it.addView(col) })
              }

              private fun save(): Int {
                  val m = (minutes.text.toString().toIntOrNull() ?: 30).coerceAtLeast(1)
                  Prefs.save(this, m, reels.isChecked, words.text.toString(), checks.filter { it.value.isChecked }.keys)
                  return m
              }

              private fun start() {
                  val m = save()
                  Prefs.setEnd(this, System.currentTimeMillis() + m * 60000L)
                  Notifier.show(this)
                  refresh()
              }

              private fun stop() {
                  Prefs.setEnd(this, 0L)
                  Notifier.hide(this)
                  refresh()
              }

              private fun refresh() {
                  val on = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                      ?.contains(packageName) == true
                  status.text = (if (on) "Accessibility: ON" else "Accessibility: OFF (pehle ON karo)") +
                      "\n" + (if (Prefs.active(this)) "Focus mode: ON" else "Focus mode: OFF")
              }

              override fun onResume() { super.onResume(); refresh() }
          }
          EOF
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BuildUp-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
