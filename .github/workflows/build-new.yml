name: Build Up APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'buildup-project.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q buildup-project.zip -d "$RUNNER_TEMP/proj"

      - name: Build APK
        working-directory: ${{ runner.temp }}/proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BuildUp-APK
          path: ${{ runner.temp }}/proj/app/build/outputs/apk/debug/app-debug.apk
          
